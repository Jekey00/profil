<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justyn Kuhne</title>
    <link rel="stylesheet" href="CSS/Landing.css">
    <link rel="stylesheet" href="JS Bot/astroBot.css">
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    <script type="module" src="JS Bot/astroBot.js"></script>
</head>
<body>
    <header>
        <h2>Kuhne Justyn</h2>
        <nav>
            <ul>
                <li><a class="navlink" id="darkModeToggle"></a></li>
                <li><a class="navlink" href="assets/Justyn_Kuhne_FP.pdf">Lebenslauf</a></li>
                <li><a class="navlink" href="https://www.linkedin.com/in/justyn-kuhne-29a959225/" target="_blank">LinkedIn</a></li>
            </ul>
        </nav>
    </header>

    <!-- Astro Bot: CSS-basierte Version, kein Canvas/WebGL mehr nötig -->
    <div id="bot-container">
        <div id="astro-bot" class="astro-bot is-idle">
            <div class="astro-bot__glow"></div>
            <div class="astro-bot__arm astro-bot__arm--left"></div>
            <div class="astro-bot__arm astro-bot__arm--right"></div>
            <div class="astro-bot__body"></div>
            <div class="astro-bot__chest-light"></div>
            <div class="astro-bot__head">
                <div class="astro-bot__visor">
                    <div class="astro-bot__eye astro-bot__eye--left"></div>
                    <div class="astro-bot__eye astro-bot__eye--right"></div>
                </div>
            </div>
        </div>

        <div id="bot-chat">
            <div id="n8n-chat-container"></div>
        </div>
    </div>

    <div class="card-container">
        <div class="card" id="flipcard">
            <div class="front">
                <img src="assets/Lebenslauf_Front.png" alt="Lebenslauf_Front" height="700px" width="524px">
            </div>
            <div class="back">
                <img src="assets/Lebenslauf_Back.png" alt="Lebenslauf_Back" height="700px" width="524px">
            </div>
        </div>
    </div>
    <div class="menu-container">
        <details class="menu-item">
            <summary class="soft-btn menu-summary">
                Zertifikate
                <span class="arrow"></span>
            </summary>
            <ul class="menu-list">
                <li>
                    <div data-iframe-width="120" data-iframe-height="140"
                        data-share-badge-id="41356746-3ab9-4751-beee-c3ee035d8cb3"
                        data-share-badge-host="https://www.credly.com"></div>
                </li>
                <li>
                    <div data-iframe-width="120" data-iframe-height="140"
                        data-share-badge-id="3ce1f7be-149d-47fc-bed0-56b1ab1dc0f8"
                        data-share-badge-host="https://www.credly.com"></div>
                </li>
                <li>
                    <div data-iframe-width="120" data-iframe-height="140"
                        data-share-badge-id="36d8c4aa-7c24-4b44-a896-ead4eb63c260"
                        data-share-badge-host="https://www.credly.com"></div>
                </li>
            </ul>
        </details>
    </div>
    <script async src="//cdn.credly.com/assets/utilities/embed.js"></script>

    <!--
      Der frühere separate n8n-Chat-Init-Block wurde entfernt: astroBot.js
      (im <head> geladen) initialisiert den Chat bereits eingebettet in
      #n8n-chat-container. Ein zweiter createChat()-Aufruf hier hätte eine
      doppelte, schwebende Chat-Bubble zusätzlich zum eingebetteten Chat erzeugt.

      Der "Besucher tippt"-Hook bleibt erhalten und nutzt jetzt window.botState,
      das astroBot.js global bereitstellt.
    -->
    <script>
        document.addEventListener("input", e => {
            if (e.target.tagName === "TEXTAREA" && window.botState) {
                window.botState("thinking");
            }
        });
    </script>

    <!--Scipt für den Dark-Mode-->
    <script>
        const a = document.getElementById("darkModeToggle");
        a.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });
    </script>
    <!--Script für die Flipcard-->
    <script>
        const card = document.getElementById("flipcard");
        card.addEventListener("click", function () {
            card.classList.toggle("flipped");
        });
    </script>
</body>
</html>
